name: 実装・不具合修正
description: 有限な完了条件と監査面を固定して、機能追加または不具合修正を追跡します。
title: ""
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        `AGENTS.md` の作業原則・設計原則を先に適用し、`docs/runbooks/issue-lifecycle.md` に沿って記入してください。区分Aは対象・受入条件・確認方法を短く示し、B/C専用欄は省略できます。同じ条件と実装の所有者は一つにし、子項目はこのIssue内で管理できます。

  - type: textarea
    id: current_status
    attributes:
      label: Current status
      description: 現在判定を一か所に集約し、In scope、Non-goals、親子Issueの所有境界も固定してください。
      placeholder: |
        - 判定: Planned / In progress / Audit pending / Merge ready / Complete / Reopened / Blocked
        - Scope revision:
        - 基準commit: None
        - Blocker: 0件
        - In scope:
        - Non-goals:
        - Parent / child ownership:
    validations:
      required: true

  - type: dropdown
    id: risk_lane
    attributes:
      label: リスク区分
      description: ファイル数ではなく、失敗時の利用者影響と責務境界で選びます。
      options:
        - "A: 軽微"
        - "B: 挙動変更"
        - "C: 境界重要"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goalと現在の問題
      description: 利用者に観測できる完了状態を一文で書き、不具合なら再現sequenceを続けてください。
      placeholder: |
        Goal:
        現在の挙動:
        再現sequence:
    validations:
      required: true

  - type: textarea
    id: canonical_refs
    attributes:
      label: 正本と根拠
      description: 関連する正本を示してください。区分Aは対象文書・pathで十分です。既存の計画があれば参照し、同じ情報を作り直す必要はありません。
      placeholder: |
        - ADR / contract:
        - 現行実装:
        - 既存test / scenario:
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteriaと対象invariant
      description: 対象・期待結果・判定方法を持つ有限個のAC-*と、維持する合意済み挙動INVAR-*を固定してください。部分作業も実装前に末端条件まで分解し、1末端条件に1PRを対応させます。条件の事後追加は受入条件の変更です。
      placeholder: |
        - [ ] AC-1:
        - [ ] AC-2:
        - [ ] INVAR-1:
    validations:
      required: true

  - type: textarea
    id: surface_inventory
    attributes:
      label: Fixed surface inventory
      description: B/Cでは合意した条件の入口→helper→結果・副作用と、変更する共通処理の呼出元を記録します。Aは省略できます。件数だけの記載は不可です。
      placeholder: |
        | ID | 入口・trigger | shared helper | 副作用sink | guard / invariant | transition | test |
        | --- | --- | --- | --- | --- | --- | --- |
        | INV-1 | | | | | TR-1 | |
    validations:
      required: false

  - type: textarea
    id: state_transitions
    attributes:
      label: State transition coverage
      description: B/Cでは合意した利用場面・入力・状態・失敗条件だけを有限に記録します。分類や監査を理由に未依頼のエッジケースを追加しません。Aは省略できます。
      placeholder: |
        | ID | 事前状態 | event / sequence | 期待状態 | 許可I/O | 禁止副作用 | test |
        | --- | --- | --- | --- | --- | --- | --- |
        | TR-1 | | | | | | |
    validations:
      required: false

  - type: textarea
    id: validation
    attributes:
      label: 検証とClose条件
      description: AC / INVARごとのtest / evidenceとpath別validationを記入してください。Aは対象確認でよく、監査不要欄は省略できます。B/Cの独立監査の要否はrunbookに従います。
      placeholder: |
        - AC-1 -> 予定PR枠 / test / evidence:
        - INVAR-1 -> test / evidence:
        - 統合・置換・削除後の最終形:
        - 関連するローカル検証 / 全体を確認するCI:
        - 独立監査: 必要 / 不要（理由）
        - Close条件:
    validations:
      required: true

  - type: checkboxes
    id: lifecycle_acknowledgement
    attributes:
      label: 起票前確認
      options:
        - label: 未依頼のエッジケースや将来要件を追加せず、受入条件の追加が必要なら実装を続ける前に完了範囲を再定義します。
          required: true
        - label: 受入条件を満たす最終コード量を最小にし、B/Cの経路確認・必要な独立監査もその固定条件に限定します。Aは非該当欄を省略できます。
          required: true
