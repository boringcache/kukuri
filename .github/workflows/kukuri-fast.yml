      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Cache Rust with Namespace
        if: inputs.provider == 'namespace'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: rust
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}

      - name: Cache Rust directories with BoringCache
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'publish' }}
          mode: archive
          cache-profiles: linux-desktop-ui
          diagnostics: summary
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}
          fail-on-cache-error: true

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Desktop lint + typecheck
        run: cargo xtask-lite desktop-lint

      - name: Desktop Vitest
        run: cargo xtask-lite desktop-test

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-browser:
