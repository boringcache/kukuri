workspace = "boringcache/kukuri"

[proxy]
metadata-hints = ["project=kukuri", "workflow=kukuri-fast"]

# One compiler-object store for every Kukuri Fast job. sccache keys are content
# hashes, so the eight Linux jobs read each other's dependency objects instead
# of each filling a private cache that the 10 GB allowance then evicts.
[adapters.cargo]
tag = "kukuri-fast-rust"

# Cargo download state is the same in every job: one Cargo.lock, one copy.
[entries.cargo-registry-cache]
tag = "kukuri-cargo-registry-cache"

[entries.cargo-registry-index]
tag = "kukuri-cargo-registry-index"

[entries.cargo-git-db]
tag = "kukuri-cargo-git-db"

# The workspace target directory. Source freshness travels with this entry, so a
# job that restores another job's target rebuilds only what it actually needs.
# The CLI splits the tag by platform, so Windows and Linux never share one.
[entries.cargo-target]
tag = "kukuri-fast-target"

# apps/desktop/src-tauri is excluded from the root workspace and keeps its own
# target directory. Only desktop-package builds it, so only windows-fast asks
# for this profile. The finished installer is a job artifact, not reusable
# compiler state.
[entries.desktop-tauri-target]
path = "apps/desktop/src-tauri/target"
tag = "kukuri-fast-desktop-tauri-target"
exclude = ["**/bundle"]

[profiles.desktop-tauri]
entries = ["desktop-tauri-target"]
