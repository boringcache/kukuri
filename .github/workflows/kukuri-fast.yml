        with:
          cache: rust
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}

      - name: Cache Rust directories with BoringCache
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'publish' }}
          mode: archive
          cache-profiles: linux-rust-tests
          diagnostics: summary
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}
          fail-on-cache-error: true

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Rust tests
        run: cargo xtask-lite rust-test

      - name: Setup Python for upstream resource contract
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Pinned iroh resource contract
        run: python tools/check_iroh_resource_contract.py

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

  linux-desktop-ui:
    name: ${{ inputs.provider == 'boringcache' && 'GitHub' || 'Namespace' }} linux-desktop-ui ${{ inputs.phase }}
    if: github.repository == 'boringcache/kukuri'
    runs-on: ${{ inputs.provider == 'boringcache' && fromJSON('["ubuntu-24.04"]') || fromJSON('["nscloud-ubuntu-24.04-amd64-4x8-with-cache","nscloud-cache-size-20gb","nscloud-cache-tag-kukuri-linux-20260925-desktop"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner and volume configuration
        env:
          CACHE_PROVIDER: ${{ inputs.provider }}
        run: |
          uname -a
          lscpu | sed -n '1,25p'
          free -h
          df -h .
          if [ -n "${NSC_CACHE_PATH:-}" ]; then
            df -h "$NSC_CACHE_PATH"
            findmnt -T "$NSC_CACHE_PATH"
          fi
          if [ "$CACHE_PROVIDER" = boringcache ] && [ -n "${NSC_CACHE_PATH:-}" ]; then
            echo 'BoringCache comparison requires a runner without Namespace cache volumes.' >&2
            exit 1
          fi

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
