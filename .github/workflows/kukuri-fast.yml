name: Kukuri Linux cache comparison
run-name: Kukuri Linux ${{ inputs.provider }} ${{ inputs.phase }}

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Rust cache provider
        type: choice
        options: [boringcache, namespace]
        default: boringcache
      phase:
        description: Cold seeds, warm restores, commit updates the cache
        type: choice
        options: [cold, warm, commit]
        default: cold
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: kukuri-linux-cache-${{ inputs.provider }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux-rust-static:
    name: Namespace linux-rust-static ${{ inputs.phase }}
    if: github.repository == 'boringcache/kukuri'
    runs-on: ${{ inputs.provider == 'boringcache' && fromJSON('["nscloud-ubuntu-24.04-amd64-8x16"]') || fromJSON('["nscloud-ubuntu-24.04-amd64-8x16-with-cache","nscloud-cache-size-20gb","nscloud-cache-tag-kukuri-linux-20260925-rust-static"]') }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record runner and volume configuration
        env:
          CACHE_PROVIDER: ${{ inputs.provider }}
        run: |
          uname -a
          lscpu | sed -n '1,25p'
          free -h
          df -h .
          if [ -n "${NSC_CACHE_PATH:-}" ]; then
            df -h "$NSC_CACHE_PATH"
            findmnt -T "$NSC_CACHE_PATH"
          fi
          if [ "$CACHE_PROVIDER" = boringcache ] && [ -n "${NSC_CACHE_PATH:-}" ]; then
            echo 'BoringCache comparison requires a runner without Namespace cache volumes.' >&2
            exit 1
          fi

      - name: Install Rust 1.92
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy,rustfmt

      - name: Install Linux system dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          pkg-config
          libdbus-1-dev
          libglib2.0-dev
          libgtk-3-dev
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache Rust with Namespace
        if: inputs.provider == 'namespace'
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          cache: rust
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}

      - name: Cache Rust directories with BoringCache
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'publish' }}
          mode: archive
          cache-profiles: linux-rust-static
          diagnostics: summary
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}
          fail-on-cache-error: true

      - name: Doctor
        run: cargo xtask-lite doctor

      - name: Oversized file report
        run: cargo xtask-lite oversized-files

      - name: Asset rights manifest
        run: cargo xtask-lite asset-check

      - name: Rust checks
        run: cargo xtask-lite rust-check

      - name: IPC types are in sync (Rust -> types.generated.ts)
        run: cargo xtask-lite ipc-types --check

      - name: Tauri compile check
        run: cargo xtask-lite tauri-check

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

