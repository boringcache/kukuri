    name: Namespace linux-rust-tests ${{ inputs.phase }}
    if: github.repository == 'boringcache/kukuri'
    runs-on: ${{ inputs.provider == 'boringcache' && fromJSON('["nscloud-ubuntu-24.04-amd64-8x16"]') || fromJSON('["nscloud-ubuntu-24.04-amd64-8x16-with-cache","nscloud-cache-size-20gb","nscloud-cache-tag-kukuri-linux-20260925-rust-tests"]') }}
    timeout-minutes: 60
    steps:
      - name: Checkout
