        with:
          cache: rust
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}

      - name: Cache Rust directories with BoringCache
        if: inputs.provider == 'boringcache'
        uses: boringcache/one@476c7df90bc1e7c2c4066aa7eb31cc057ef7f8d1 # v1.32.0
        with:
          cli-version: ${{ inputs.cli_version }}
          trust-policy: ${{ inputs.phase == 'warm' && 'restore' || 'publish' }}
          mode: archive
          cache-profiles: linux-desktop-browser
          diagnostics: summary
          fail-on-cache-miss: ${{ inputs.phase != 'cold' }}
          fail-on-cache-error: true

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/desktop
        run: pnpm exec playwright install chromium

      - name: Desktop Storybook build
        run: cargo xtask-lite desktop-storybook

      - name: Desktop browser tests
        run: cargo xtask-lite desktop-browser-test

      - name: Desktop visual regression tests
        run: cargo xtask-lite desktop-visual-test

      - name: Upload visual regression diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kukuri-desktop-visual-diff
          path: apps/desktop/test-results/
          if-no-files-found: ignore

      # #1120: workspace crate の成果物は checkout ごとに再 compile されるため、Cache Volume に残さない。
      - name: Prune workspace build artifacts
        run: cargo xtask-lite ci-prune-target

